[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lab7-opencode-capstone"
version = "0.2.0"
description = "Week 7 Capstone: OpenCode Multi-Agent System"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
